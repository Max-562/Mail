<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>

    <script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>
<script type="text/javascript">
   (function(){
      emailjs.init({
        publicKey: "Wnpk4WAEVNJhzmQ2U",
      });
   })();
</script>
<style>
            body {
            background-color: black; 
            color: white;  
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
        }
    #grad { 
        background-image: linear-gradient(to bottom right, red, yellow);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .div {
        background-color: rgb(32, 59, 67);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    input {
        margin-bottom: 10px;
        padding: 8px;
        width: 200px;
        border-radius: 4px;
        border: 1px solid #c612eeb2;
    }
    button {
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background-color: rgb(28, 54, 219);
    }
</style>

</head>
<body>
    <div class="div">
        <h2>Email</h2>
    <label>
        Name <input type="text" id="username" placeholder="Enter Full Name">
    </label>
    <br>
    <br>
    <label>
        Email <input type="text" id="useremail" placeholder="Enter Your Email">
     </label>
     <br>
    <br>
     <label>
        Message <input type="text" id="usermessage" placeholder="Enter Your Message">
     </label>
     <br>
    <br>
     <button onclick="submit()">Click</button>
    </div>
    <script>
        function submit(){
         let username = document.getElementById("username").value;
         let useremail = document.getElementById("useremail").value;
         let usermessage = document.getElementById("usermessage").value;
         let params = {
             Name : username,
             Email : useremail,
             message : usermessage
         }
         emailjs.send("service_sk8xruj", "template_pe2mnbn", params).then((res) => {
                 alert("Query Sent");
                 console.log(res)
             })
             .catch((error) => {console.log(error)})
        }
      </script>
</body>
</html>
